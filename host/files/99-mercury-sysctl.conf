# Requisitos del Elasticsearch embebido de SonarQube
vm.max_map_count = 524288
fs.file-max = 131072

# Con 12 GB de RAM: usar swap solo bajo presión real
vm.swappiness = 10

# Los puertos publicados solo en LAN_IP (AdGuard, NPM :81, Samba, db-dev) se reservan
# aunque la IP aún no exista: si Docker arranca antes que el DHCP (cable suelto,
# router lento), no quedan caídos ni arrancados sin puertos
net.ipv4.ip_nonlocal_bind = 1
