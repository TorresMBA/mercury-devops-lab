# Servidores de base de datos de dev, compartidos por todas las apps (una base y un usuario por app).
# Cada motor va en su perfil: nada arranca con `./mercury up all` salvo los listados en
# COMPOSE_PROFILES del .env. A demanda: ./mercury db up dev <postgres|mariadb|mssql>
# Publica sus puertos solo en la IP LAN para conectarse desde Windows (db-dev.<INT_DOMAIN>).
# Las apps los alcanzan por nombre de contenedor en net-db-dev.
name: db-dev

x-db: &db
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *db
    image: postgres:${POSTGRES_VERSION}
    container_name: pg-dev
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/db/dev/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${LAN_IP}:5432:5432"
    networks:
      - db
      - publish
    mem_limit: 512m

  mariadb:
    <<: *db
    image: mariadb:${MARIADB_VERSION}
    container_name: mariadb-dev
    profiles: ["mariadb"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/db/dev/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${LAN_IP}:3306:3306"
    networks:
      - db
      - publish
    mem_limit: 512m

  mssql:
    <<: *db
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION}
    container_name: mssql-dev
    profiles: ["mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
      # Por debajo de mem_limit: SQL Server reserva memoria fuera de su buffer pool
      MSSQL_MEMORY_LIMIT_MB: "1536"
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR}/db/dev/mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    ports:
      - "${LAN_IP}:1433:1433"
    networks:
      - db
      - publish
    mem_limit: 2g

networks:
  # Interna: la comparten las apps de dev (compose.deploy.yaml y compose.quick.yaml)
  db:
    name: net-db-dev
    external: true
  # Una red interna no publica puertos: esta, propia del stack, da el acceso desde la LAN
  publish: {}
