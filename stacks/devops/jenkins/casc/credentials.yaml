# Credenciales de Jenkins, agrupadas por dominio. Jenkins carga todos los YAML de
# esta carpeta; jenkins.yaml tiene el resto de la configuración.
# Los ${...} de las cuentas de git salen de ../credentials.env (no versionado);
# los de registry y SonarQube, del .env del stack a través de compose.yaml.
# Tras editar: ./mercury up jenkins si también cambió credentials.env (recrea el
# contenedor); si solo cambió este archivo, ./mercury restart jenkins.
#
# Añadir una cuenta: sus variables en credentials.env y un bloque aquí, dentro del
# dominio de su proveedor. ID con la forma <proveedor>-<dueño> (github-mercury).
#
# Un dominio con hostnameSpecification hace que, al configurar un job, solo se
# ofrezcan las credenciales cuyo dominio coincide con la URL del repositorio.
# Ordena y filtra, pero no aísla: un Jenkinsfile puede pedir cualquier ID.

credentials:
  system:
    domainCredentials:
      # Dominio global: las usan las plantillas de agente, mercury-ci y los Jenkinsfile.
      # No cambiar estos ID.
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "registry"
              description: "Registry privado de Mercury"
              username: "${REGISTRY_USER}"
              password: "${REGISTRY_PASSWORD}"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "Token de análisis de SonarQube"
              secret: "${SONAR_TOKEN}"

      - domain:
          name: "GitHub"
          description: "Cuentas de github.com"
          specifications:
            - hostnameSpecification:
                includes: "github.com"
        credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-mercury"
              description: "GitHub: cuenta principal"
              username: "${GITHUB_MERCURY_USER}"
              password: "${GITHUB_MERCURY_TOKEN}"
          # Otra cuenta del mismo proveedor: mismo dominio, otro ID.
          # - usernamePassword:
          #     scope: GLOBAL
          #     id: "github-company"
          #     description: "GitHub: cuenta de la empresa"
          #     username: "${GITHUB_COMPANY_USER}"
          #     password: "${GITHUB_COMPANY_TOKEN}"

      - domain:
          name: "GitLab"
          description: "Cuentas de gitlab.com"
          specifications:
            - hostnameSpecification:
                # Un GitLab propio se añade separado por coma: "gitlab.com,gitlab.empresa.com"
                includes: "gitlab.com"
        credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "gitlab-mercury"
              description: "GitLab: cuenta principal"
              username: "${GITLAB_MERCURY_USER}"
              password: "${GITLAB_MERCURY_TOKEN}"

      # - domain:
      #     name: "Bitbucket"
      #     description: "Cuentas de bitbucket.org"
      #     specifications:
      #       - hostnameSpecification:
      #           includes: "bitbucket.org"
      #   credentials:
      #     - usernamePassword:
      #         scope: GLOBAL
      #         id: "bitbucket-mercury"
      #         description: "Bitbucket: cuenta principal"
      #         username: "${BITBUCKET_MERCURY_USER}"
      #         password: "${BITBUCKET_MERCURY_TOKEN}"

      # Llaves SSH hacia otros servidores. Sin especificación de host: el dominio solo agrupa.
      # Una llave privada tiene varias líneas y no cabe en credentials.env: hay que montar
      # el archivo en el controller (volumes de compose.yaml) y leerlo con readFile.
