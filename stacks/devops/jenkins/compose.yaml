# Jenkins: el controller solo orquesta (0 executors). Los builds corren en agentes
# efímeros que el plugin Docker Cloud crea y destruye a través de socket-proxy.
name: jenkins

services:
  jenkins:
    build:
      context: .
      args:
        JENKINS_VERSION: ${JENKINS_VERSION}
    image: mercury/jenkins:${JENKINS_VERSION}
    container_name: jenkins
    restart: unless-stopped
    depends_on:
      - socket-proxy
    # Tokens de las cuentas de git: pasan enteros al controller y casc/credentials.yaml
    # los sustituye. Una cuenta nueva no obliga a tocar este archivo.
    env_file:
      - credentials.env
    environment:
      TZ: ${TZ}
      # NodeProvisioner: crear el agente en cuanto hay un build en cola, sin esperar a
      # que la carga media lo justifique (comportamiento por defecto de Jenkins)
      JAVA_OPTS: >-
        -Xmx768m
        -Djenkins.install.runSetupWizard=false
        -Dhudson.slaves.NodeProvisioner.initialDelay=0
        -Dhudson.slaves.NodeProvisioner.MARGIN=50
        -Dhudson.slaves.NodeProvisioner.MARGIN0=0.85
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc
      # casc/jenkins.yaml reutiliza bloques con anclas YAML; el límite por defecto es 50 alias
      CASC_YAML_MAX_ALIASES: "200"
      # Variables que los YAML de casc/ sustituyen con ${...}
      INT_DOMAIN: ${INT_DOMAIN}
      REGISTRY_HOST: ${REGISTRY_HOST}
      INBOX_DIR: ${INBOX_DIR}
      APPS_DIR: ${APPS_DIR}
      JENKINS_MAX_AGENTS: ${JENKINS_MAX_AGENTS:-2}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - ${DATA_DIR}/jenkins:/var/jenkins_home
      - ./casc:/usr/share/jenkins/casc:ro
      - ../../../pipelines:/usr/share/jenkins/pipelines:ro
    networks:
      - net-tools
      - agents
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true

  # Expone solo una parte de la API de Docker. Aun así, poder crear contenedores
  # equivale a ser root en el host: por eso esta red no se comparte con nadie más.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION}
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EXEC: 1
      POST: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      AUTH: 1
      DISTRIBUTION: 1
      # docker build con BuildKit
      BUILD: 1
      SESSION: 1
      GRPC: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agents
    mem_limit: 64m

networks:
  net-tools:
    external: true
  # Nombre fijo: casc/jenkins.yaml conecta aquí a los agentes para que alcancen socket-proxy
  agents:
    name: mercury-jenkins
