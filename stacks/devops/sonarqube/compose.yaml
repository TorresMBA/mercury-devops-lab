# Calidad de código. Es el stack más pesado (~3.4 GB): se puede detener cuando no se use.
# Requiere vm.max_map_count=524288 en el host (host/01-base.sh).
name: sonarqube

services:
  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION}
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      # Tres JVM (web, compute engine, búsqueda) con heap acotado para caber en 12 GB
      SONAR_WEB_JAVAOPTS: -Xms128m -Xmx512m
      SONAR_CE_JAVAOPTS: -Xms128m -Xmx512m
      SONAR_SEARCH_JAVAOPTS: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    volumes:
      - ${DATA_DIR}/sonarqube/data:/opt/sonarqube/data
      - ${DATA_DIR}/sonarqube/extensions:/opt/sonarqube/extensions
      - ${DATA_DIR}/sonarqube/logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    networks:
      - net-tools
      - db
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true

  sonar-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - ${DATA_DIR}/sonarqube/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - db
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

networks:
  net-tools:
    external: true
  # Sin salida a otras redes: solo SonarQube habla con su base de datos
  db:
    internal: true
