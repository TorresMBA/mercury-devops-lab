# Grafana: paneles sobre Prometheus (monitoring/metrics) y Loki (monitoring/logs).
# Las fuentes de datos y los dashboards se cargan desde ./provisioning y ./dashboards.
name: grafana

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GF_SERVER_ROOT_URL: https://grafana.${INT_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    networks:
      - net-tools
      - net-obs
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true

networks:
  net-tools:
    external: true
  # Red privada del grupo monitoring (host/04-networks.sh)
  net-obs:
    external: true
